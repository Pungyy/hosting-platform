name: CI

# Finding M3-4 (audit sécurité) — protège réellement les corrections de
# sécurité déjà réalisées (C1-C5, H1, M1, M2, M3-1, M3-2) en exécutant
# automatiquement, sur chaque push/PR vers master, la même suite de
# tests que celle validée manuellement pendant l'audit — y compris les
# tests PostgreSQL réels (verrous H1/M2, quotas M3-1/M3-2, à deux
# connexions distinctes).
#
# Volontairement exclu (voir rapport M3-4) : les tests Docker réels
# opt-in (deployment.real-docker.test.ts / backup.real-docker.test.ts,
# gardés par AGENT_REAL_DOCKER_TESTS=1) restent désactivés ici — leur
# nature (assertions temporelles réelles sur une infrastructure
# partagée) les rend impropres à un job bloquant à chaque PR.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Aucune version Node n'est contractuellement fixée dans le
          # repo (pas de champ "engines", pas de .nvmrc). Node 22 est
          # choisi parce que c'est la version RÉELLEMENT utilisée avec
          # succès pour l'ensemble des vérifications tsc/eslint/vitest/
          # next build de cet audit (C1-C5 à M3-3) — un fait vérifié
          # empiriquement à de nombreuses reprises, plus fiable que les
          # champs @types/node incohérents entre apps/panel (^20) et
          # apps/agent (26.4.1), qui ne sont que des types, pas une
          # contrainte de runtime.
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap PostgreSQL roles and test database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail

          # Le healthcheck du service ci-dessus garantit seulement que
          # le process Postgres répond — pas que la base cible est
          # utilisable : l'image officielle postgres démarre une
          # instance TEMPORAIRE d'initialisation qui répond déjà "ready"
          # avant que l'instance finale ne soit prête (piège réel déjà
          # rencontré et documenté pendant le chantier Sauvegardes puis
          # le test Docker réel M2). On vérifie donc nous-mêmes avec une
          # vraie requête avant de continuer, plutôt que de faire
          # confiance au seul healthcheck GitHub Actions.
          for i in $(seq 1 30); do
            if psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -c "SELECT 1;" > /dev/null 2>&1; then
              echo "PostgreSQL accepte réellement les requêtes."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL n'a jamais répondu à une vraie requête après 60s." >&2
              exit 1
            fi
            sleep 2
          done

          # Reproduit le modèle de rôles réellement utilisé en
          # développement (voir finding M3-1) :
          #   - regardscroises : possède la base de test et applique les
          #     migrations. Les migrations 001 et 013 référencent ce nom
          #     littéralement dans des ALTER DEFAULT PRIVILEGES — le rôle
          #     qui migre DOIT donc s'appeler exactement "regardscroises",
          #     sans quoi ces instructions échoueraient ou s'appliquer-
          #     aient à un rôle sans rapport.
          #   - hosting_platform_user : doit exister car la migration 001
          #     lui accorde des droits (GRANT ... TO hosting_platform_user)
          #     — jamais utilisé par les tests eux-mêmes, mais nécessaire
          #     pour que la migration s'applique sans erreur.
          #   - hosting_platform_test_user : le rôle NON privilégié
          #     (NOSUPERUSER NOCREATEDB NOCREATEROLE) réellement utilisé
          #     par la suite de tests d'intégration (TEST_DATABASE_USER).
          # "regardscroises" n'a besoin d'aucun privilège élevé : il est
          # propriétaire de la base (OWNER), ce qui suffit pour créer des
          # tables, leur accorder des droits, et fixer ses propres
          # privilèges par défaut (ALTER DEFAULT PRIVILEGES FOR ROLE
          # regardscroises est toujours permis sur son propre rôle).
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE regardscroises WITH LOGIN PASSWORD 'ci_test_password';" \
            -c "CREATE ROLE hosting_platform_user WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci_test_password';" \
            -c "CREATE ROLE hosting_platform_test_user WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci_test_password';" \
            -c "CREATE DATABASE hosting_platform_test OWNER regardscroises;"

      - name: Apply migrations 001 -> 014
        env:
          PGPASSWORD: ci_test_password
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            psql -h 127.0.0.1 -p 5432 -U regardscroises -d hosting_platform_test -v ON_ERROR_STOP=1 -f "$migration"
          done

          # Complète, pour les tables ANTÉRIEURES à la migration 013, ce
          # que le mécanisme ALTER DEFAULT PRIVILEGES de cette migration
          # ne couvre que pour les tables créées APRÈS lui (vérifié
          # empiriquement : sans cette étape, hosting_platform_test_user
          # ne peut lire ni "users" ni aucune autre table 001-012 — en
          # local, ce même besoin a toujours été couvert par un GRANT
          # manuel hors version, jamais capturé dans les migrations
          # elles-mêmes). Exécuté une seule fois, après toutes les
          # migrations connues à ce jour.
          psql -h 127.0.0.1 -p 5432 -U regardscroises -d hosting_platform_test -v ON_ERROR_STOP=1 \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO hosting_platform_test_user;"

      - name: Verify schema and permissions on a fresh database
        env:
          PGPASSWORD: ci_test_password
        run: |
          set -euo pipefail

          # Une table par migration significative (001, 009, 010, 013,
          # 014) : si l'une manque, une migration a échoué silencieusement
          # ou a été appliquée dans le désordre.
          for table in users servers sites domains deployments databases backups user_resource_quotas tenant_deployment_slots; do
            exists=$(psql -h 127.0.0.1 -p 5432 -U regardscroises -d hosting_platform_test -tAc \
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='$table';")
            if [ "$exists" != "1" ]; then
              echo "Table manquante après application des migrations : $table" >&2
              exit 1
            fi
          done
          echo "Toutes les tables attendues existent (migrations 001 -> 014 appliquées)."

          is_superuser=$(psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -tAc \
            "SELECT rolsuper FROM pg_roles WHERE rolname='hosting_platform_test_user';")
          if [ "$is_superuser" != "f" ]; then
            echo "hosting_platform_test_user ne doit JAMAIS être superuser (rolsuper=$is_superuser)." >&2
            exit 1
          fi
          echo "hosting_platform_test_user confirmé NON superuser."

          # Vérifie que le mécanisme de privilèges par défaut posé par la
          # migration 013 (correction M3-1) a bien couvert automatiquement
          # une table créée APRÈS lui (tenant_deployment_slots, migration
          # 014) — exactement la propriété que ce mécanisme devait garantir.
          if ! PGPASSWORD=ci_test_password psql -h 127.0.0.1 -p 5432 -U hosting_platform_test_user -d hosting_platform_test \
              -c "SELECT COUNT(*) FROM tenant_deployment_slots;" > /dev/null 2>&1; then
            echo "hosting_platform_test_user ne peut pas lire tenant_deployment_slots — permissions incorrectes." >&2
            exit 1
          fi
          if ! PGPASSWORD=ci_test_password psql -h 127.0.0.1 -p 5432 -U hosting_platform_test_user -d hosting_platform_test \
              -c "SELECT COUNT(*) FROM users;" > /dev/null 2>&1; then
            echo "hosting_platform_test_user ne peut pas lire users — permissions incorrectes." >&2
            exit 1
          fi
          echo "hosting_platform_test_user a bien accès aux tables attendues, y compris les plus récentes."

          # Aucun accès à une base de développement/production n'existe
          # dans cet environnement : hosting_platform_test est la SEULE
          # base créée dans ce job, sur un service Postgres éphémère,
          # sans lien avec l'infrastructure locale ou de production.

      - name: Panel typecheck
        run: pnpm --filter @hosting/panel typecheck

      - name: Panel lint
        run: pnpm --filter @hosting/panel lint

      - name: Panel tests
        env:
          # Valeurs de test uniquement — aucun secret réel, aucune base
          # de développement ou de production. DATABASE_* (dev) est
          # volontairement OMIS : aucune route/test n'en a besoin
          # (vérifié — toutes les pages App Router concernées sont des
          # "use client", aucun accès DB au build ; les tests mockent ou
          # utilisent exclusivement TEST_DATABASE_*), et le définir à la
          # MÊME valeur que TEST_DATABASE_NAME déclencherait à tort le
          # garde-fou de sécurité de vitest.setup.ts ("Refus de lancer
          # les tests d'intégration : TEST_DATABASE_NAME est identique à
          # DATABASE_NAME").
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: "5432"
          TEST_DATABASE_NAME: hosting_platform_test
          TEST_DATABASE_USER: hosting_platform_test_user
          TEST_DATABASE_PASSWORD: ci_test_password
        run: |
          set -euo pipefail
          # Clé de chiffrement de test générée à la volée (jamais une
          # valeur en dur committée) — aucun test réel n'exerce le
          # module de chiffrement sans le mocker, mais la définir reste
          # une protection défensive sans coût ni risque.
          export AGENT_TOKEN_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          pnpm --filter @hosting/panel test

      - name: Panel build
        run: pnpm --filter @hosting/panel build

  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Agent typecheck
        run: pnpm --filter @hosting/agent typecheck

      - name: Agent tests
        # AGENT_REAL_DOCKER_TESTS n'est délibérément PAS défini :
        # deployment.real-docker.test.ts et backup.real-docker.test.ts
        # restent skip (describe.skipIf) — aucun daemon Docker n'est
        # nécessaire pour cette suite (dockerode est mocké). Les valeurs
        # AGENT_TOKEN/TRAEFIK_TOKEN nécessaires au chargement de
        # apps/agent/src/config.ts sont déjà fixées de façon déterministe
        # dans apps/agent/vitest.config.ts — rien à définir ici.
        run: pnpm --filter @hosting/agent test
